name: belediyesinden

# Belediyesinden · Yerel geliştirme altyapısı
# Kullanım:  cd infra && docker compose up -d --wait
# Durdurmak: docker compose down            (veriler volume'larda kalır)
# Sıfırlamak: docker compose down -v        (volume'leri de siler)

services:
  postgres:
    image: postgres:16
    container_name: bldys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-belediyesinden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-belediyesinden_dev}
      POSTGRES_DB: ${POSTGRES_DB:-belediyesinden}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-belediyesinden} -d ${POSTGRES_DB:-belediyesinden}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: bldys-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: bldys-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-belediyesinden}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-belediyesinden_dev}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: localhost
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes/belediyesinden:/opt/keycloak/themes/belediyesinden:ro
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: bldys-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: bldys-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${OPENSEARCH_ADMIN_PASSWORD:-mavi-kartal-siyah-Kalem7!}"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ---- Uygulama katmanı (tek `docker compose up` ile tam stack) ----

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: bldys-api
    restart: unless-stopped
    # Keycloak token ISS = http://localhost:8080 (KC_HOSTNAME=localhost). API'nin
    # ISS eşleşmesi için KEYCLOAK_URL=localhost olmalı; container host-gateway ile
    # host'un 8080'ine (Keycloak) ulaşır.
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-belediyesinden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-belediyesinden_dev}
      POSTGRES_DB: ${POSTGRES_DB:-belediyesinden}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-belediyesinden}
      KEYCLOAK_API_CLIENT_ID: api
      KEYCLOAK_ADMIN_BASE_URL: http://localhost:8080
      KEYCLOAK_ADMIN_TARGET_REALM: ${KEYCLOAK_REALM:-belediyesinden}
      KEYCLOAK_ADMIN_CLIENT_ID: admin-cli
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-belediyesinden.com}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_BUCKET: ${MINIO_BUCKET:-belediyesinden}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      OPENSEARCH_NODE: http://opensearch:9200
      DB_LOGGING: "false"
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      keycloak:
        condition: service_started

  tenant-web:
    build:
      context: ..
      dockerfile: apps/tenant-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${TENANT_WEB_API_URL:-http://localhost:3000/api}
        NEXT_PUBLIC_WS_URL: ${TENANT_WEB_WS_URL:-ws://localhost:3000/ws}
        NEXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-belediyesinden}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: tenant-web
        NEXT_PUBLIC_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-talas}
    container_name: bldys-tenant-web
    restart: unless-stopped
    environment:
      # SSR fetch'leri container içi -> compose service adı (runtime, server-only).
      API_INTERNAL_URL: http://api:3000/api
    ports:
      - "${TENANT_WEB_PORT:-4200}:4200"
    depends_on:
      - api

  portal:
    build:
      context: ..
      dockerfile: apps/portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PORTAL_API_URL:-http://localhost:3000/api}
        NEXT_PUBLIC_TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-belediyesinden.com}
    container_name: bldys-portal
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3000/api
    ports:
      - "${PORTAL_PORT:-4201}:4201"
    depends_on:
      - api

  # ---- Monitoring (Prometheus + Grafana) ----

  prometheus:
    image: prom/prometheus:latest
    container_name: bldys-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: bldys-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  minio_data:
  opensearch_data:
  prometheus_data:
  grafana_data:
