parent=keycloak
import=common/keycloak

# Belediyesinden özel login teması (base keycloak theme — FreeMarker)
styles=css/styles.css

locales=tr

# "Tüm İlanlar" üst bar linki — merkezi portal'a gider (bkz. infra/docker-compose.yml
# PORTAL_PORT, realm-export.json'da "portal" client rootUrl'i), o an giriş yapılan
# tenant-web istemcisinin baseUrl'ine değil — "Tüm İlanlar" tüm belediyeleri
# kapsayan merkezi listeyi ifade ediyor, tek bir belediyenin alt alan adını değil.
portalUrl=http://localhost:4201
