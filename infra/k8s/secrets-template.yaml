# Belediyesinden — K8s Secrets template
# Üretimde: kubectl create secret generic belediyesinden-secrets --from-literal=...
# veya SealedSecrets / External Secrets / Vault ile yönetin.
---
apiVersion: v1
kind: Secret
metadata:
  name: belediyesinden-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
  KEYCLOAK_ADMIN_PASSWORD: "CHANGE_ME"
  MINIO_ROOT_PASSWORD: "CHANGE_ME"
  REDIS_PASSWORD: ""
  OPENSEARCH_ADMIN_PASSWORD: "CHANGE_ME"
  # GitLab container registry
  REGISTRY_TOKEN: "CHANGE_ME"
