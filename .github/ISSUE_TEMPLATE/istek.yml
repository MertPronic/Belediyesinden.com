name: ✨ İstek / iyileştirme
description: Yeni bir özellik ya da mevcut bir şeyin değişmesi
title: "[İstek] "
labels: ["istek"]
body:
  - type: textarea
    id: ne
    attributes:
      label: Ne istiyorsunuz?
    validations:
      required: true
  - type: textarea
    id: neden
    attributes:
      label: Neden? Kim kullanacak?
      description: Hangi kullanıcı (vatandaş, belediye personeli, encümen…) hangi durumda ihtiyaç duyuyor
    validations:
      required: true
  - type: dropdown
    id: oncelik
    attributes:
      label: Öncelik
      options:
        - Demo için şart
        - Önemli ama bekleyebilir
        - Olsa güzel olur
    validations:
      required: true
  - type: textarea
    id: ek
    attributes:
      label: Ek bilgi / görsel
      description: Örnek ekran, mevzuat maddesi, başka sitelerden örnek…
