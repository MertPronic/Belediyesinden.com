# Belediyesinden · GitLab CI iskeleti
# nx affected: sadece değişen projeler (ve bağımlılıkları) lint/test/build edilir.
# Docker image build ve deploy aşamaları ilerleyen fazlarda eklenir (Faz 6).

image: node:24

stages:
  - install
  - verify

variables:
  GIT_DEPTH: "0" # nx affected için tam git geçmişi

install:
  stage: install
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
  script:
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

verify:
  stage: verify
  needs: [install]
  script:
    # origin/main'e göre etkilenen projeler; MR dışında (main push) tüm geçmişe kıyasla.
    - pnpm nx affected -t lint test build --base=origin/main
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
